<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Kein Netz: connect-src 'self' (nur die eigenen App-Dateien für den Offline-Speicher), keine fremden Skripte -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>LagerKit · Spektron</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#4c6322">
<script src="spektron-ordner.js"></script>
<style>
/* ===== SPEKTRON-LOOK v1 – gemeinsames Aussehen der Spektron-Apps (byte-gleich in jeder App; Prüfung: tests/leiste.cjs) =====
   Nur Tokens (--sp-*) und allgemeine Bausteine, keine App-Farbe: jede App setzt --sp-app / --sp-app-dunkel AUSSERHALB dieses
   Blocks auf ihre Farbe aus der Spektron-Leiste. Ändern nur hier und dann in alle Apps kopieren (wie MOSAIK-LEISTE). */
:root{
  --sp-bg:#f3f5f7; --sp-panel:#fff; --sp-panel2:#f7f9fb; --sp-line:#dfe6ec; --sp-line2:#b9c8d3; --sp-text:#17222c; --sp-muted:#5b6b78;
  --sp-ok:#2e7d4f; --sp-err:#c0392b; --sp-gap:#fff3a6; --sp-pille:#e4c04a; --sp-app:#5b6b78; --sp-app-dunkel:#3f4b55;
  --sp-font:"Segoe UI",system-ui,-apple-system,Arial,sans-serif; --sp-radius:14px; --sp-radius-k:10px;
  --sp-h:44px; --sp-h-haupt:50px; --sp-h-gross:56px; --sp-schatten:0 1px 4px rgba(0,0,0,.08);
}
body{font-family:var(--sp-font);background:var(--sp-bg);color:var(--sp-text)}
.sp-karte{background:var(--sp-panel);border-radius:var(--sp-radius);box-shadow:var(--sp-schatten)}
.sp-knopf{height:var(--sp-h);padding:0 16px;border-radius:var(--sp-radius-k);border:1.5px solid var(--sp-line2);background:var(--sp-panel);color:var(--sp-text);font:inherit;font-size:15px;cursor:pointer}
.sp-knopf:hover{border-color:var(--sp-app);color:var(--sp-text)}
.sp-knopf-app{border-color:var(--sp-app-dunkel);background:var(--sp-app-dunkel);color:#fff;font-weight:700}
.sp-knopf-app:hover{background:var(--sp-app);border-color:var(--sp-app-dunkel);color:#fff}
.sp-haupt{height:var(--sp-h-haupt);padding:0 24px;border-radius:12px;border:0;background:var(--sp-app-dunkel);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.sp-haupt:hover{background:var(--sp-app);color:#fff}
.sp-knopf:focus-visible,.sp-haupt:focus-visible,.sp-kachel:focus-visible{outline:3px solid var(--sp-text);outline-offset:3px}
/* Auswahl als Kacheln (z. B. BerichtKit „Welcher Bericht?“ / „Welche Form?“): Frage links, Kacheln, Notiz rechts */
.sp-wahl{background:var(--sp-panel);border-radius:var(--sp-radius);box-shadow:var(--sp-schatten);padding:16px 20px 18px;display:flex;flex-direction:column;gap:12px}
.sp-wahl-zeile{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.sp-wahl-frage{flex:none;width:150px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sp-muted)}
.sp-wahl-kacheln{display:flex;gap:10px;flex-wrap:wrap}
.sp-kachel{width:150px;min-height:64px;margin:0;padding:6px 8px;border-radius:var(--sp-radius-k);border:1.5px dashed var(--sp-line2);background:var(--sp-bg);color:var(--sp-text);font:inherit;font-size:14px;font-weight:600;line-height:1.2;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;opacity:1}
.sp-kachel.flach{width:auto;min-width:150px;min-height:52px;padding:6px 18px}
.sp-kachel:hover:not(:disabled):not([aria-pressed="true"]){border-style:solid;border-color:var(--sp-app);background:var(--sp-panel);color:var(--sp-text)}
.sp-kachel[aria-pressed="true"]{border:1.5px solid var(--sp-panel);background:var(--sp-panel);box-shadow:0 0 0 3px var(--sp-app);font-weight:700;cursor:default}
.sp-kachel:disabled{border-color:var(--sp-line);color:#8a9aa6;cursor:not-allowed;opacity:1}
.sp-kachel svg{width:22px;height:22px;flex:none}
.sp-kachel small{font-size:11.5px;font-weight:400;color:inherit}
.sp-kachel .sp-tag{font-size:11px;font-weight:600;color:var(--sp-ok)}
.sp-wahl-notiz{flex:1 1 200px;min-width:0;font-size:12.5px;color:var(--sp-muted)}
.sp-wahl-notiz b.sp-ok{color:var(--sp-ok)}
/* Rückfrage im Ablauf (statt Browser-Dialog): Satz + zwei Knöpfe */
.sp-rueckfrage{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fdf0e6;border:1px solid #e3b58f;border-radius:var(--sp-radius-k);padding:10px 14px;font-size:13.5px}
.sp-rueckfrage > span{flex:1 1 260px}
.sp-rueckfrage .sp-knopf{height:38px;font-size:14px}
/* Zähler offener Stellen als gelbe Pille */
.sp-pille{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 16px;border-radius:20px;border:0;background:var(--sp-pille);color:var(--sp-text);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
@media print{.sp-wahl,.sp-rueckfrage{display:none!important}}
/* ===== Ende SPEKTRON-LOOK v1 ===== */
</style>
<style>
:root{
  /* LagerKit-Farbe: Moosgrün (noch frei in der Suite; Mock-up-Türkis liegt zu nah an BelegKit #2f7d6d und LexiKit #3a8a83).
     #5f7a2b auf Weiß 4,9 : 1, #4c6322 auf Weiß 6,7 : 1 – nach dem Spektron-Look gesetzt */
  --sp-app:#5f7a2b; --sp-app-dunkel:#4c6322;
  --rot-bg:#f8e3df; --rot-rand:#e8b7ad; --rot-text:#8c2d22;
  --gelb-bg:#fbf0c9; --gelb-rand:#e6cf7a; --gelb-text:#5e4a00;
  --lila-bg:#e8e4f3; --lila-text:#4b3c86;
  --asb-bg:#fbe4e4; --asb-text:#a12b2b;
  --grau:#8a9aa6;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-size:15px}
a{color:var(--sp-app-dunkel)}a:hover{color:#2f3e14}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--sp-text)}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--sp-app-dunkel);outline-offset:2px}
.leise{color:var(--sp-muted)}
code,.mono{font-family:Consolas,"Cascadia Mono",monospace}
/* Kopf (wie LexiKit, ohne Leiste) */
.kopf{background:var(--sp-panel);border-bottom:1px solid var(--sp-line);position:sticky;top:0;z-index:20}
.kopf-in{max-width:1400px;margin:0 auto;padding:10px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.home{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--sp-line2);border-radius:10px;color:var(--sp-text);text-decoration:none;font-weight:600;background:var(--sp-panel);font-size:15px}
.home:hover{border-color:var(--sp-app);color:var(--sp-text)}
.marke{display:flex;align-items:baseline;gap:10px;flex-grow:1;flex-wrap:wrap;min-width:0}
.marke b{font-size:22px;color:var(--sp-app-dunkel)}
.marke span{font-size:15px;color:var(--sp-muted)}
.marke strong{font-size:16px}
.wer{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sp-muted)}
.wer select{height:40px;border:1.5px solid var(--sp-line2);border-radius:10px;padding:0 8px;background:#fff;min-width:170px}
.wer select.leer{background:var(--sp-gap);border-color:#d6b800}
.mehr{position:relative}
.mehr summary{list-style:none;display:flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--sp-line2);border-radius:10px;font-weight:600;cursor:pointer;background:var(--sp-panel)}
.mehr summary::-webkit-details-marker{display:none}
.mehr[open] summary{border-color:var(--sp-app)}
.mehr-pop{position:absolute;right:0;top:50px;z-index:30;background:var(--sp-panel);border:1px solid var(--sp-line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:6px;min-width:280px;display:flex;flex-direction:column}
.mehr.unten .mehr-pop{top:auto;bottom:52px;left:0;right:auto}
.mehr-pop button{background:none;border:0;text-align:left;padding:11px 12px;border-radius:8px;font-size:15px;color:var(--sp-text)}
.mehr-pop button:hover{background:var(--sp-bg)}
.mehr-pop hr{border:0;border-top:1px solid var(--sp-line);margin:4px 6px}
/* Seite */
main{max-width:1400px;margin:0 auto;padding:20px 24px 130px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:26px}
h2{margin:0;font-size:18px}
.kopfzeile{display:flex;align-items:flex-end;gap:12px 16px;flex-wrap:wrap}
.kopfzeile > div:first-child{flex:1 1 420px;display:flex;flex-direction:column;gap:4px;min-width:0}
.zahlen{color:var(--sp-muted)}
.zahlen b.rot{color:var(--rot-text)}
.meldung{border-radius:12px;padding:12px 16px;font-size:15px;line-height:1.45;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.meldung > span{flex:1 1 300px}
.meldung.warn{background:#fdf0e6;border:1px solid #e3b58f}
.meldung.err{background:#fbe9e7;border:1px solid #e0a39b;color:#6d1f17}
.meldung.ok{background:#e8f3ec;border:1px solid #a8cdb5}
.meldung.gelb{background:var(--sp-gap);border:1px solid #d6b800;color:#4d4300}
.meldungen{display:flex;flex-direction:column;gap:8px}
.karte{background:var(--sp-panel);border-radius:var(--sp-radius);box-shadow:var(--sp-schatten)}
.karte-kopf{display:flex;align-items:center;gap:10px 12px;padding:14px 18px;flex-wrap:wrap;border-bottom:1px solid var(--sp-line)}
.karte-kopf .tit{flex:1 1 260px;display:flex;flex-direction:column;gap:2px;min-width:0}
.karte-kopf.rot{background:var(--rot-bg)}.karte-kopf.rot h2{color:var(--rot-text)}
.karte-kopf.gelb{background:var(--gelb-bg)}.karte-kopf.gelb h2,.karte-kopf.gelb .leise{color:var(--gelb-text)}
.karte-fuss{padding:12px 18px;border-top:1px solid var(--sp-line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filter{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;padding:14px 16px}
.feld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--sp-muted);letter-spacing:.05em;text-transform:uppercase}
.feld input,.feld select{height:42px;border:1.5px solid var(--sp-line2);border-radius:10px;padding:0 12px;text-transform:none;letter-spacing:0;font-weight:400;background:#fff}
.feld.breit{flex:1 1 320px}
.ueber{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sp-muted)}
/* Regalplatz-Kacheln */
.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kachel{background:#fff;border:1.5px solid var(--sp-line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-height:64px;justify-content:center;text-align:left;font:inherit;color:var(--sp-text)}
.kachel b{font-size:16px}
.kachel small{font-size:13px;color:var(--sp-muted)}
.kachel.rot{background:var(--rot-bg);border-color:var(--rot-rand)}.kachel.rot small{color:var(--rot-text)}
.kachel.gelb{background:var(--gelb-bg);border-color:var(--gelb-rand)}.kachel.gelb small{color:var(--gelb-text)}
.kachel:hover{border-color:var(--sp-app)}
.kachel[aria-pressed="true"]{box-shadow:0 0 0 3px var(--sp-app);border-color:#fff}
/* Tabellen */
.tab-wrap{overflow-x:auto}
table.liste{width:100%;border-collapse:collapse;font-size:14px}
table.liste th{text-align:left;color:var(--sp-muted);font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:10px 8px;border-bottom:1px solid var(--sp-line);white-space:nowrap}
table.liste td{padding:9px 8px;border-bottom:1px solid #eef2f5;vertical-align:top}
table.liste th:first-child,table.liste td:first-child{padding-left:18px}
table.liste th:last-child,table.liste td:last-child{padding-right:18px}
table.liste tr.klick{cursor:pointer}
table.liste tr.klick:hover td{background:var(--sp-panel2)}
.nr{font-family:Consolas,monospace;font-weight:700;font-size:15px;white-space:nowrap}
.fett{font-weight:600}
.marke-k{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12.5px;font-weight:600;margin:2px 4px 0 0}
.m-asb{background:var(--asb-bg);color:var(--asb-text)}
.m-gelb{background:var(--gelb-bg);color:var(--gelb-text)}
.m-lila{background:var(--lila-bg);color:var(--lila-text)}
.m-grau{background:#eef2f5;color:#3a4954}
.m-gruen{background:#e8f3ec;color:#1f5a37}
tr.grau td,.grau{color:var(--grau)}
tr.storno td{color:var(--grau);text-decoration:line-through}
tr.storno td .nicht-durch{text-decoration:none;display:inline-block}
tr.blitz td{animation:blitz 2.4s ease-out}
@keyframes blitz{0%,40%{background:#fff3a6}100%{background:transparent}}
details.klapp{background:var(--sp-panel);border-radius:var(--sp-radius);box-shadow:var(--sp-schatten)}
details.klapp > summary{padding:14px 18px;font-weight:700;cursor:pointer}
details.klapp > summary span{font-weight:400;color:var(--sp-muted)}
details.klapp[open] > summary{border-bottom:1px solid var(--sp-line)}
.gruppe-kopf td{background:var(--sp-panel2);font-weight:700;color:var(--sp-app-dunkel)}
/* Erfassen */
.spalten{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.spalten > .haupt{flex:999 1 700px;min-width:0}
.spalten > .seite{flex:1 1 340px;min-width:0}
.erf input[type=text],.erf select{height:36px;border:1.5px solid var(--sp-line2);border-radius:8px;padding:0 8px;background:#fff;width:100%;min-width:0}
.erf input.kurz{width:110px}.erf input.kuerzel{width:72px}
.erf td{padding:8px 6px}
.erf .luecke{background:var(--sp-gap)!important;border-color:#d6b800!important}
.erf tr.gewaehlt td{background:#f2f6ea}
.erf .ro{color:#3a4954}
.erf .klein{font-size:12px;color:var(--sp-muted)}
.erf .quelle{font-size:12px;color:var(--sp-app-dunkel)}
.unbek{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sp-muted);margin-top:3px;white-space:nowrap}
.unbek input{accent-color:var(--sp-app-dunkel)}
.detail{padding:14px 18px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--sp-line)}
.detail .felder{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.detail label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sp-muted)}
.detail label.f input,.detail label.f select{height:38px;border:1.5px solid var(--sp-line2);border-radius:8px;padding:0 8px;background:#fff}
.detail .haken{display:flex;align-items:center;gap:8px;font-size:14px;min-height:38px}
.detail .haken input{width:20px;height:20px;accent-color:var(--sp-app-dunkel)}
.aktionen{display:flex;gap:8px;flex-wrap:wrap}
.linkknopf{background:none;border:0;padding:4px 0;color:var(--sp-app-dunkel);text-decoration:underline;font-size:14px}
.verlauf{margin:0;padding-left:18px;font-size:13px;color:#3a4954;line-height:1.5}
.lkliste{display:flex;flex-direction:column}
.lkliste label{display:flex;gap:10px;align-items:flex-start;padding:10px 18px;border-bottom:1px solid #eef2f5;cursor:pointer}
.lkliste label.schon{opacity:.55;cursor:default}
.lkliste input{margin-top:3px;width:18px;height:18px;accent-color:var(--sp-app-dunkel)}
.seite.karte{box-shadow:0 0 0 3px var(--sp-app),var(--sp-schatten)}
/* Fußleiste */
.fuss{position:fixed;left:0;right:0;bottom:0;background:var(--sp-panel);border-top:1px solid var(--sp-line);z-index:15}
.fuss-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:12px 14px;padding:10px 24px;flex-wrap:wrap}
.fuss .stand{color:var(--sp-muted);font-size:14px}
.fuss .stand.err{color:var(--sp-err);font-weight:600}
.platzhalter{flex:1}
.einraeumen{position:sticky;top:66px;z-index:14;background:var(--sp-app-dunkel);color:#fff;border-radius:12px;padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:17px;font-weight:700}
.einraeumen .sp-knopf{height:40px;font-weight:700}
/* Inventur: Leiste „Prüfen“ – andere Farbe und anderes Wort als „Einräumen“ (prüft nur, bucht nie um) */
.pruefen{position:sticky;top:66px;z-index:14;background:var(--lila-text);color:#fff;border-radius:12px;padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:17px;font-weight:700}
.pruefen .sp-knopf{height:40px;font-weight:700}
.meldung.ruhig{background:var(--gelb-bg);border:1px solid var(--gelb-rand);color:var(--gelb-text)}
.meldung.ruhig .linkknopf{color:var(--gelb-text);font-size:15px}
.kachel .gepr{font-size:12px;color:var(--sp-muted)}
.kachel .gepr.faellig{color:var(--gelb-text);font-weight:600}
.sp-knopf.klein{height:34px;font-size:13.5px;padding:0 10px}
.inv-ok{color:var(--sp-ok);font-weight:700}
.inv-teil{padding:4px 0 8px}
.inv-teil h3{font-size:14px;margin:10px 18px 4px;letter-spacing:.03em}
table.liste.inv{table-layout:fixed}
table.liste.inv td:nth-child(1){width:170px}table.liste.inv td:nth-child(2){width:24%}table.liste.inv td:nth-child(3){width:26%}
.wohin{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sp-muted);flex-wrap:wrap}
.wohin select,.wohin input{height:36px;border:1.5px solid var(--sp-line2);border-radius:8px;padding:0 8px;background:#fff;font-size:14px}
.belege{display:flex;flex-direction:column;border-bottom:1px solid var(--sp-line);padding-bottom:6px}
.beleg-zeile{background:none;border:0;border-top:1px solid #eef2f5;text-align:left;padding:9px 18px;font:inherit;font-size:14px;color:var(--sp-app-dunkel);text-decoration:underline}
/* Einsammeln */
.sammel{display:flex;flex-direction:column;gap:10px}
.sk{background:#fff;border-radius:14px;box-shadow:var(--sp-schatten);padding:14px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.sk.vorgemerkt{box-shadow:0 0 0 3px var(--sp-app),var(--sp-schatten)}
.sk .pl{width:120px;display:flex;flex-direction:column;gap:2px}
.sk .pl small{font-size:12px;font-weight:700;color:var(--sp-app-dunkel)}
.sk .mitte{flex:1 1 360px;display:flex;flex-direction:column;gap:3px;min-width:0}
.wahl3{display:flex;border:1.5px solid var(--sp-line2);border-radius:10px;overflow:hidden}
.wahl3 button{height:44px;padding:0 14px;border:0;border-right:1.5px solid var(--sp-line2);background:#fff;color:var(--sp-text);font-size:15px}
.wahl3 button:last-child{border-right:0}
.wahl3 button[aria-pressed="true"]{background:var(--sp-app-dunkel);color:#fff;font-weight:700}
.gesperrt-text{font-size:14px;color:var(--lila-text);max-width:320px}
/* Dialoge */
dialog{border:0;border-radius:14px;padding:0;box-shadow:0 10px 40px rgba(0,0,0,.3);max-width:min(760px,94vw);width:100%}
dialog::backdrop{background:rgba(23,34,44,.45)}
.dlg{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.dlg h2{font-size:20px}
.dlg label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.dlg label.f input,.dlg label.f select,.dlg label.f textarea{font-size:16px;padding:8px 10px;border:1.5px solid var(--sp-line2);border-radius:8px;background:#fff;font-weight:400}
.dlg textarea{min-height:70px;resize:vertical}
.dlg .knoepfe{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px}
.dlg .fehlertext{color:#a3281c;font-size:14px}
.dlg .liste-scroll{max-height:46vh;overflow:auto;border:1px solid var(--sp-line);border-radius:10px}
.dlg .liste-scroll label{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid #eef2f5;font-weight:400;font-size:14.5px}
.dlg .liste-scroll label input{width:18px;height:18px;accent-color:var(--sp-app-dunkel)}
.startfeld{display:grid;grid-template-columns:repeat(2,52px);gap:4px}
.startfeld button{height:30px;border:1.5px solid var(--sp-line2);border-radius:6px;background:#fff;font-size:13px}
.startfeld button.leer{background:#e8ecef;color:#8a9aa6;border-style:dashed}
.startfeld button[aria-pressed="true"]{background:var(--sp-app-dunkel);color:#fff;border-color:var(--sp-app-dunkel);font-weight:700}
.druckinfo{background:var(--sp-panel2);border:1px solid var(--sp-line);border-radius:10px;padding:10px 14px;font-size:13.5px;line-height:1.5}
.deckel{background:var(--gelb-bg);border:1px solid var(--gelb-rand);color:var(--gelb-text);border-radius:10px;padding:10px 14px;font-weight:700}
.zu-lang{color:#7a3f12;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:60;background:#17222c;color:#fff;border-radius:12px;padding:12px 18px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:14px;align-items:center;max-width:min(92vw,760px)}
.toast.gut{background:#1f5a37}.toast.schlecht{background:#8c2d22}
.toast button{background:#fff;color:#17222c;border:0;border-radius:8px;height:34px;padding:0 12px;font-weight:700}
.zugang{max-width:760px;margin:40px auto;display:flex;flex-direction:column;gap:14px}
.zugang .knoepfe{display:flex;gap:10px;flex-wrap:wrap}
.anleitung{max-width:860px;line-height:1.55}
.anleitung li{margin:4px 0}
.platzliste td input{height:36px;border:1.5px solid var(--sp-line2);border-radius:8px;padding:0 8px;width:100%}
@media print{.kopf,.fuss,.toast{display:none!important}}

      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h14V10"></path></svg>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------

/** Inhalt eines Eintrags ohne Verlauf und Stempel (Nummer zählt nicht: die kann beim Zusammenführen weiterrücken) */

/* Die vier Dateiarten: Schlüssel der Liste, Prüfung beim Lesen */
const DATEIEN = {
  projekt: { format: FORMAT.projekt, feld: 'proben' },
  ohne: { format: FORMAT.ohne, feld: 'proben' },
  einst: { format: FORMAT.einst, feld: 'plaetze' },
  index: { format: FORMAT.index, feld: 'projekte' },

  out[G.feld] = listeMergen(eigene.ersetzen ? [] : base[G.feld], gelegt);
  if (art === 'projekt') { nummernPruefen(out.proben); out.ansLabor = listeMergen(base.ansLabor || [], eigene.ansLabor || []); }
  if (art === 'ohne') nummernPruefen(out.proben);

    if (base.blankoBereiche || eigene.bereiche) out.blankoBereiche = listeMergen(base.blankoBereiche || [], eigene.bereiche || []);
    if (base.blankoZuordnung || eigene.zuordnung) out.blankoZuordnung = listeMergen(base.blankoZuordnung || [], eigene.zuordnung || []);

}
function enthaeltAlles(art, disk, eigene) {
  if (!disk || disk.kaputt) return false;
  const G = DATEIEN[art];
  if (!enthaelt(disk[G.feld], eigene.eintraege)) return false;
  if (art === 'projekt' && !enthaelt(disk.ansLabor || [], eigene.ansLabor || [])) return false;
  if (art === 'einst' && !(enthaelt(disk.blankoBereiche || [], eigene.bereiche || []) && enthaelt(disk.blankoZuordnung || [], eigene.zuordnung || []))) return false;
  if (eigene.felder) { const d = disk.felderGeaendert || {}; for (const k of Object.keys(eigene.felder.werte || {})) if (ms(d[k]) < ms(eigene.felder.am)) return false; }

/** Sicher schreiben (wie LexiKit 0.4.0): neu lesen, vereinigen, schreiben, nach 1,5 s zurücklesen, prüfen, sonst noch einmal.

    if (disk && disk.kaputt) throw Object.assign(new Error(disk.neuer ? 'Die Datei stammt aus einer neueren LagerKit-Fassung – bitte LagerKit neu laden. LagerKit überschreibt sie nicht.' : 'Die Datei ist nicht lesbar (' + disk.kaputt + ') – LagerKit überschreibt sie nicht.'), { kaputt: true, neuer: !!disk.neuer });
    if (disk && enthaeltAlles(art, disk, eigene) && !opt.immer) return disk;

/* ---------- Index der Übersicht (Zwischenspeicher, jederzeit neu aufbaubar) ---------- */
/** Ein Projekt → Eintrag im Index. info = { ordner, personen, uebergabe, asbest:Set, monate, stand:{t,size}, lk: laborproben } */

}

}

/* ---------- Regalplätze ---------- */
const naechsterPlatzNr = plaetze => (plaetze || []).reduce((m, p) => Math.max(m, Number(p.nr) || 0), 0) + 1;

function platzNummernPruefen(plaetze) {
  const nach = new Map();
  for (const p of plaetze.slice().sort((a, b) => (ms(a.angelegt) - ms(b.angelegt)) || String(a.id).localeCompare(String(b.id)))) {
    if (nach.has(p.nr) && !(p.gedruckt || []).length) { p.nr = naechsterPlatzNr(plaetze); p.code = pCode(p.nr); }
    nach.set(p.nr, p);
  }

}
/** Sortierung wie im Regal: „Regal A · Fach 2“ vor „Regal A · Fach 10“, unbenutzte zuletzt */
const platzSort = (a, b) => (!!a.nichtMehr - !!b.nichtMehr) || String(a.name).localeCompare(String(b.name), 'de', { numeric: true });

/* ---------- Inventur (Plan F1, F2) ----------
   erwartet = Übersicht-Einträge, die laut LagerKit auf dem Platz liegen; gescannt = [{ code, k|null, frei }] in Scan-Reihenfolge.
   Nichts ändert sich von selbst: Das Ergebnis nennt nur, was zu tun wäre – jede Korrektur ist ein eigener Klick mit Namen. */
const istEntsorgt = k => !!(k && (k.status === 'entsorgt' || k.entsorgt));

  for (const g of gescannt || []) {

    const k = g.k;

    if (gesehen.has(k.key)) continue;
    gesehen.add(k.key);

  }

}
/** Was von einer Probe in der Inventur-Datei steht (fest, druckbar – auch wenn sich die Probe später ändert) */
function inventurProbe(k) {

    was: k.was || '', ort: k.u ? 'gefunden: ' + (k.gefunden || '') : (k.ort || ''), platz: k.platz || '', codes: [k.code].concat(k.blanko || []).filter(Boolean),

}
/** Prüfung eines Platzes für _LagerKit\Inventuren\ (eine Zeile je Platz und Durchgang) */
function inventurPruefung(platz, ergebnis, meta) {
  const m = meta || {}, l = x => (x || []).map(inventurProbe);
  return { id: m.id || neueId(), lauf: m.lauf || '', platz: platz.id, platzName: platz.name || '', platzCode: platz.code || '', wer: m.wer || '', start: m.start || '', fertig: m.fertig || '',
    geaendert: m.fertig || m.start || '', da: l(ergebnis.da), fehlt: l(ergebnis.fehlt), woanders: l(ergebnis.woanders), entsorgt: l(ergebnis.entsorgt),

}

function letzteInventur(dateien) {
  const aus = {};
  for (const d of dateien || []) for (const p of (d && d.pruefungen) || []) {
    const t = berlinTag((p && p.fertig) || ''); if (t && (!aus[p.platz] || t > aus[p.platz])) aus[p.platz] = t;
  }

}

    if (!hier.length) continue;
    let ab = letzte && letzte[pl.id];
    if (!gueltig(ab)) { ab = hier.map(k => k.seit).filter(gueltig).sort()[0]; if (!ab) continue; }

/* ---------- Blanko-Etiketten (Plan F3, F4) ----------
   Nummern LKB0001 … werden nie gezählt, sondern als Bereich in _LagerKit\Einstellungen.json reserviert (blankoBereiche: { id, von, bis,
   wer, am }). Ein reservierter Bereich kommt nie wieder – auch nicht nach abgebrochenem Druck. Überschneiden sich zwei Reservierungen
   (zwei PCs gleichzeitig), weichen beide auf einen neuen Bereich aus: Gedruckt wird nur ein Bereich, der beim Prüfen allein stand.
   Vergeben (zugeordnet) wird jeder Code genau einmal: blankoZuordnung { id: Code, ordner, u, probe, wer, am }. */
const BLANKO_MAX = 120;

function blankoStand(einst, code) {
  const c = codeLesen(code); if (!c || c.art !== 'B') return { reserviert: null, zuordnung: null };
  return { reserviert: ((einst && einst.blankoBereiche) || []).find(b => b && b.von <= c.nr && b.bis >= c.nr) || null,
    zuordnung: ((einst && einst.blankoZuordnung) || []).find(z => z && z.id === c.code) || null };
}
/** Bereich reservieren und prüfen (io wie sicherSchreiben, auf Einstellungen.json). opt = { n, wer, mindest, warten, jetzt } → { bereich, versuche } */
async function blankoReservieren(io, opt) {
  const n = Math.max(1, Math.min(BLANKO_MAX, Math.floor(Number(opt.n) || 0))), warten = opt.warten == null ? 1500 : opt.warten, uhr = opt.jetzt || (() => new Date().toISOString());
  let mindest = opt.mindest || 1, alt = null;
  for (let v = 0; v < (opt.versuche || 6); v++) {
    const d0 = dateiLesen('einst', await io.lesen());
    if (d0 && d0.kaputt) throw Object.assign(new Error('Die Einstellungen sind nicht lesbar oder neuer – LagerKit überschreibt sie nicht.'), { kaputt: true });
    const am = uhr(), von = blankoFrei(d0 && d0.blankoBereiche, mindest);
    const b = { id: neueId(), von, bis: von + n - 1, wer: opt.wer || '', am, geaendert: am };
    let d;
    try { d = await sicherSchreiben(io, 'einst', { eintraege: [], bereiche: alt ? [alt, b] : [b] }, { warten, zwischen: opt.zwischen }); }
    catch (e) { if (e.kaputt) throw e; d = null; }   // ließ sich nicht sicher schreiben: dieser Bereich gilt als verworfen, nächster Versuch
    let frei = !!d && !blankoUeberschneidung(d.blankoBereiche, b).length;
    if (frei) {   // zweite Prüfung etwas später: steht der Bereich noch allein da?
      await io.warten(warten);
      d = dateiLesen('einst', await io.lesen());
      frei = !!(d && !d.kaputt && (d.blankoBereiche || []).some(x => x.id === b.id && !x.verworfen) && !blankoUeberschneidung(d.blankoBereiche, b).length);
    }
    if (frei) return { bereich: b, versuche: v + 1 };
    mindest = Math.max(b.bis + 1, blankoFrei(d && !d.kaputt ? d.blankoBereiche : [], 1));
    const am2 = uhr(); alt = Object.assign({}, b, { verworfen: am2, geaendert: am2 });
    await io.warten(Math.round(Math.random() * warten));   // zufällig kurz warten, damit zwei PCs nicht wieder gleichzeitig greifen
  }
  throw new Error('Es ließ sich kein freier Nummernbereich sicher reservieren – vermutlich drucken gerade mehrere PCs. Bitte gleich noch einmal.');
}
/** Blanko-Code einer Probe zuordnen – genau einmal. z = { code, ordner, u, probe, wer, am } → { ok } | { schon: Eintrag } */
async function blankoZuordnen(io, z, opt) {
  opt = opt || {};
  const e = Object.assign({}, z, { id: z.code, geaendert: z.am }), warten = opt.warten == null ? 1500 : opt.warten;
  const fremd = d => ((d && !d.kaputt && d.blankoZuordnung) || []).find(x => x && x.id === z.code && x.probe !== z.probe) || null;
  try {
    await sicherSchreiben(io, 'einst', { eintraege: [], zuordnung: [e] }, { warten, zwischen: opt.zwischen, vorSchreiben: d => { const s = fremd(d); if (s) throw Object.assign(new Error('schon vergeben'), { schon: s }); } });
  } catch (x) { if (!x.schon) throw x; await io.warten(warten); return { schon: fremd(dateiLesen('einst', await io.lesen())) || x.schon }; }   // der Stand, der sich gesetzt hat
  await io.warten(warten);
  const d = dateiLesen('einst', await io.lesen()), s = fremd(d);
  if (s) { await io.warten(warten); return { schon: fremd(dateiLesen('einst', await io.lesen())) || s }; }
  if (!(d && !d.kaputt && (d.blankoZuordnung || []).some(x => x.id === z.code))) throw new Error('Die Zuordnung ließ sich nicht sicher speichern – bitte noch einmal scannen.');

}

/* ---------- Entsorgungsliste: „wohin“ und fester Beleg (Plan F5, F6) ---------- */
const wohinVorschlag = k => (k && k.asbest ? 'Asbestabfall' : '');
const wohinText = (w, frei) => w === 'Sonstiges' ? (text(frei, 120).trim() ? 'Sonstiges: ' + text(frei, 120).trim() : 'Sonstiges') : (WOHIN.includes(w) ? w : '');

const kuerzelDatei = s => String(s || '').normalize('NFC').replace(/[^\p{L}\p{N}]/gu, '') || 'ohne';

/* ---------- Entsorgungslisten als feste Belege (Plan F6) ---------- */
/** Eine Zeile der Liste, so wie sie gerade dasteht (rohe Texte, kein HTML) */
function belegZeile(k, ergebnis, wv) {

  const hinweise = [k.asbest ? 'Asbest nachgewiesen – als asbesthaltigen Abfall entsorgen' : k.verdacht ? 'Asbest / schadstoffhaltig (Verdacht)' : '', k.sperre ? 'gesperrt – nicht entsorgen: ' + k.sperre.warum + ' (' + k.sperre.wer + ')' : '',

    was: k.was || '', ort: k.u ? 'gefunden: ' + (k.gefunden || '') : (k.ort || ''), platz: platzName(k.platz), genommen, bis: k.bis || '', rest: k.rest || '', hinweise,
    ergebnis, wohin: ergebnis === 'entsorgt' && wv ? K.wohinText(wv.w, wv.frei) : '', eingetragen: false, nichtEingetragen: '' };
}
async function belegAblegen(beleg) {
  try {

    return null;

}
const belegZahl = b => (b.proben || []).filter(x => x.eingetragen && (x.ergebnis === 'entsorgt' || x.ergebnis === 'nichtGefunden')).length;

    ${l.length > 8 ? `<button type="button" class="linkknopf" style="margin:4px 18px" data-aktion="belege-alle">${S.belegeAlle ? 'weniger zeigen' : 'alle ' + l.length + ' zeigen'}</button>` : ''}</div>`;
}
const ERGEBNIS = { entsorgt: 'entsorgt', nichtGefunden: 'nicht gefunden', behalten: 'behalten', offen: 'offen – nichts eingetragen', gesperrt: 'gesperrt – nicht entsorgt' };

      <td>${z.hinweise.map(esc).join('<br>')}</td><td><b>${esc(ERGEBNIS[z.ergebnis] || z.ergebnis)}</b>${z.verlaengertBis ? '<br>verlängert bis ' + de(z.verlaengertBis) + (z.warum ? ' – ' + esc(z.warum) : '') : ''}${z.nichtEingetragen ? '<br><i>nicht eingetragen: ' + esc(z.nichtEingetragen) + '</i>' : ''}</td><td>${esc(z.wohin)}</td></tr>`).join('')}</tbody></table>`;

const belegKopf = (b, name) => `Eingetragen am ${de(b.tag)} um ${uhr(b.am)} von ${esc(b.werName || b.wer)} (${esc(b.wer)}) · ${belegZahl(b)} Proben eingetragen · fester Beleg <code>_LagerKit\\Entsorgungslisten\\${esc(name)}</code> – wird nie geändert`;

/* ---------- Scanner (USB-Handscanner als Tastatur) ----------
   Ein Scan = schnelle Zeichenfolge mit Enter am Ende. Landet er in einem Textfeld, nimmt LagerKit die Zeichen dort wieder heraus. */
const SCAN = { puffer: '', letzte: 0, abstaende: [], ziel: null, vorher: null };
const scanGrenzen = () => Object.assign({ luecke: 90, schnitt: 45, min: 6 }, window.LAGERKIT_SCAN || {});
function scanTaste(e) {
  if (e.ctrlKey || e.altKey || e.metaKey || e.isComposing) return;
  const t = performance.now(), g = scanGrenzen();
  if (e.key === 'Enter') {
    const c = SCAN.puffer.length >= g.min && SCAN.abstaende.length && (SCAN.abstaende.reduce((a, b) => a + b, 0) / SCAN.abstaende.length) <= g.schnitt && (t - SCAN.letzte) <= g.luecke * 2 ? K.codeLesen(SCAN.puffer) : null;
    if (c) {
      e.preventDefault(); e.stopPropagation();
      const z = SCAN.ziel, v = SCAN.vorher;
      if (z && v && document.contains(z)) {   // getippte Zeichen aus dem Feld wieder heraus
        z.value = v.wert; if (v.a != null && z.setSelectionRange) try { z.setSelectionRange(v.a, v.b); } catch (x) { /* kein Textfeld */ }
        z.dispatchEvent(new Event('input', { bubbles: true }));
      }
      const roh = SCAN.puffer; scanReset();
      codeVerarbeiten(c, roh, true);
      return;
    }
    scanReset(); return;
  }
  if (e.key.length !== 1) { if (e.key !== 'Shift' && e.key !== 'CapsLock') scanReset(); return; }
  if (!SCAN.puffer || t - SCAN.letzte > g.luecke) {
    scanReset();
    const a = document.activeElement;
    if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) { SCAN.ziel = a; SCAN.vorher = { wert: a.value, a: a.selectionStart, b: a.selectionEnd }; }
  } else SCAN.abstaende.push(t - SCAN.letzte);
  SCAN.puffer += e.key; SCAN.letzte = t;
}
function scanReset() { SCAN.puffer = ''; SCAN.abstaende = []; SCAN.ziel = null; SCAN.vorher = null; }
/** Gefunden zu einem Code: { k (Übersicht-Eintrag) } oder Platz */
const zugeordnetK = (alle, u) => alle.find(k => k.projekt && u.zugeordnet && k.projekt.ordner === u.zugeordnet.projekt && k.nr === u.zugeordnet.nr) || null;
function findeCode(c) {
  if (!c) return {};
  if (c.art === 'P') return { platz: ((S.einst && S.einst.plaetze) || []).find(p => p.code === c.code) || null };
  const alle = alleProben();
  if (c.art === 'U') { const u = K.da((S.ohne && S.ohne.proben) || []).find(x => x.nr === c.nr); return { u, k: alle.find(k => k.u && k.nr === c.nr) || (u && u.zugeordnet ? zugeordnetK(alle, u) : null) }; }
  if (c.art === 'B') {   // Blanko-Etikett: über die Probe (codes) – sonst über die Zuordnung in den Einstellungen (der Index kann hinterherhinken)
    const st = K.blankoStand(S.einst, c.code);
    let k = alle.find(x => (x.blanko || []).includes(c.code)) || null;
    if (!k && st.zuordnung) {
      const z = st.zuordnung, u = z.u ? uProbe(z.probe) : null;
      k = z.u ? (u ? (u.zugeordnet ? zugeordnetK(alle, u) : alle.find(x => x.u && x.id === u.id) || null) : null) : alle.find(x => x.projekt && x.projekt.ordner === z.ordner && x.id === z.probe) || null;
    }
    return { k, zuordnung: st.zuordnung, frei: !k && !st.zuordnung && !!st.reserviert };
  }
  return { k: alle.find(k => !k.u && k.projekt && k.projekt.nr === c.projekt && k.nr === c.nr) || null };
}
/** Scan oder Suche („26.0612 R2“) */
async function codeVerarbeiten(c, roh, scan) {
  if ($('dlg').open) { if (scan) { ton(false); toast('Erst den offenen Dialog schließen.'); } return; }
  if (S.ansicht === 'inventur' && S.inv) return inventurScan(c);   // Prüfen: nie umbuchen
  const f = findeCode(c), titel = c.art === 'P' || c.art === 'B' ? c.code : c.art === 'U' ? 'U' + c.nr : c.projekt + ' R' + c.nr;
  if (c.art === 'P') {
    if (!f.platz) { ton(false); toast('Unbekannter Regalplatz-Code ' + esc(c.code) + '.', 'schlecht'); return; }
    if (S.ansicht === 'projekt' && S.p && S.p.gewaehlt) {   // im Erfassen: Regalplatz der gewählten Zeile
      const p = probeVon(S.p.gewaehlt);
      if (p && !p.storniert && !K.entsorgt(p)) {
        if (p.nrFest) { ton(true); platzDialog({ id: p.id }, f.platz.id); return; }
        p.platz = f.platz.id; lokal.set('lagerkit-letzter-platz', f.platz.id); geaendert(p); ton(true); toast('R' + p.nr + ': Regalplatz ' + esc(f.platz.name), 'gut'); neuZeichnen(); return;
      }
    }
    if (S.ansicht === 'einsammeln') { const el = [...document.querySelectorAll('.sk .pl small')].find(x => x.textContent === f.platz.name); if (el) el.scrollIntoView({ block: 'center' }); ton(true); return; }
    ton(true); geheZu('ansicht=platz&id=' + encodeURIComponent(f.platz.id)); return;
  }
  // R- oder U-Code
  if (S.ansicht === 'einsammeln') {
    const k = f.k, l = sammelListe();
    if (!k) { ton(false); toast(esc(titel) + ': unbekannte Probe – nichts vorgemerkt.', 'schlecht'); return; }
    if (k.status === 'entsorgt') { ton(false); toast(esc(titel) + ' ist schon als entsorgt eingetragen (' + esc(k.entsorgt.wer) + ', ' + datumZeit(k.entsorgt.am) + ').', 'schlecht'); return; }
    if (k.sperre) { ton(false); toast(esc(titel) + ' ist gesperrt – nicht entsorgen: ' + esc(k.sperre.warum) + ' (' + esc(k.sperre.wer) + '). Nichts vorgemerkt.', 'schlecht'); return; }
    if (!l.some(x => x.key === k.key)) { ton(false); toast(esc(titel) + ' ist nicht fällig (aufbewahren bis mind. ' + de(k.bis) + ') – zurück ins Regal, nichts vorgemerkt.', 'schlecht'); return; }
    S.sammel.marks.set(k.key, 'entsorgt'); ton(true);
    toast('✓ ' + esc(titel) + ' · ' + esc(k.was) + ' als „entsorgt“ vorgemerkt.', 'gut', { text: 'rückgängig', tun: () => { S.sammel.marks.delete(k.key); neuZeichnen(); } });
    neuZeichnen();
    const el = document.querySelector(`.sk[data-key="${CSS.escape(k.key)}"]`); if (el) el.scrollIntoView({ block: 'center' });
    return;
  }
  if (S.ansicht === 'platz' && S.platz && S.platz.einraeumen) {
    if (!f.k) { ton(false); toast(esc(titel) + ': unbekannte Probe – nichts verschoben.', 'schlecht'); return; }
    if (f.k.status === 'entsorgt') { ton(false); toast(esc(titel) + ' ist als entsorgt eingetragen – nichts verschoben.', 'schlecht'); return; }
    return verschieben(zielVon(f.k), S.platz.id, 'eingeräumt (Scan)');
  }
  if (c.art === 'B' && !f.k) {
    if (f.zuordnung) { ton(true); blankoOeffnen(f.zuordnung); return; }
    if (f.frei) { ton(true); blankoFreiDialog(c.code, S.ansicht === 'platz' && S.platz ? S.platz.id : ''); return; }
    ton(false); toast(esc(titel) + ': unbekanntes Blanko-Etikett – diese Nummer hat LagerKit nie reserviert.', 'schlecht'); return;
  }
  if (!f.k && !f.u) {
    if (c.art === 'R') {   // vielleicht noch nicht im Index: Projekt mit dieser Nummer öffnen
      const namen = await projektOrdner(), o = namen.filter(n => (K.projektNr(n) || {}).nr === c.projekt);
      if (o.length === 1) { const dir = await S.archiv.getDirectoryHandle(o[0]); const { lager } = await lagerLesen(dir, c.projekt); const p = lager && !lager.kaputt && K.da(lager.proben).find(x => x.nr === c.nr);
        if (p) { ton(true); geheZu('projekt=' + encodeURIComponent(o[0]) + '&probe=' + encodeURIComponent(p.id)); return; } }
    }
    ton(false); toast(esc(titel) + ': unbekannte Probe.', 'schlecht'); return;
  }
  ton(true);
  if (c.art === 'U') { uKarte(f.u); return; }
  if (f.k.u) { const u = uProbe(f.k.id); if (u) uKarte(u); return; }
  if (S.ansicht === 'projekt' && S.p && S.p.name !== f.k.projekt.ordner) {
    toast(esc(titel) + ' gehört zu ' + esc(projektTitel(f.k.projekt)) + '.', '', { text: 'Dort öffnen', tun: () => probeZeigen(f.k.key) }); return;
  }
  probeZeigen(f.k.key);
}
